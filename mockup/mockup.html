<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        #loading{
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2500;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity .5s ease;
            
        }
        #loading .loader{
            width: 150px;
            aspect-ratio: 1;
            display: grid;
            -webkit-mask: conic-gradient(from 22deg, #0003,#000);
            mask: conic-gradient(from 22deg, #0003,#000);
            animation: load .5s steps(8) infinite;
        }
        #loading .loader, .loader::before{
            --_g: linear-gradient(#17177c 0 0) 50%;
            background:
                var(--_g) 50%/34% 8% space no-repeat,
                var(--_g) 50%/8% 34% no-repeat space;
        }
        #loading .loader::before{
            content: "";
            transform: rotate(45deg);
        }
        @keyframes load{
            to{transform:rotate(1turn)}
        }

        #loading.loaded{
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Mockup</title>
    <link 
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <div id="loading">
        <div class="loader"></div>
    </div>
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"
    ></script>
    <script src="//unpkg.com/alpinejs" defer></script>
    <div id="root">
        <header class="header-map">
            <nav>
                <a href="/">about</a>
                <a href="/">contribute</a>
                <a href="/">requests</a>
            </nav>
            <div class="filters">
                <img class="filter-callout" src="../static/images/icons/filter-solid-full.svg" alt="">
                <div class="button-wrap">
                    <div class="filter-button-container">
                        <button id="filter_button_what"><img src="../static/images/icons/music-note.png" alt="">what</button>
                        <div class="filter-what-arrow"></div>
                    </div>
                    <div class="filter-button-container">
                        <button id="filter_button_when"><img src="../static/images/icons/calendar-regular-full-black.svg" alt="">
                            when
                        </button>
                        <div class="filter-when-arrow"></div>
                    </div>
                    <div class="filter-button-container">
                        <button id="filter_button_who"><img src="../static/images/icons/people-icon-gay.png" alt="">
                            who
                        </button>
                        <div class="filter-when-arrow"></div>
                    </div>
                </div>
                <div id="filter_what" class="filter-window">
                    <div class="window-inner">
                        What
                    </div>
                </div>
                <div id="filter_when" class="filter-window">
                    <div class="window-inner">
                        When
                    </div>
                </div>
                <div id="filter_who" class="filter-window">
                    <div class="window-inner">
                        Who
                    </div>
                </div>
            </div>
        </header>
        <div id="tooltip_filter_callout">
            <div class="close">X</div>
            <p>Click here to filter results</p>
        </div>
        <div id="popup_main"></div>
        <div id="map" class="content"></div>
        <footer class="footer-map">
            <p>Every submission is reviewed to add to the map!</p>
            <button>Submit an Event</button>
        </footer>
    </div>
    <script>
        let openFilter          = false
        let popupOpen           = false
        const filterButtonWhat  = document.getElementById('filter_button_what')
        const filterWhat        = document.querySelector('#filter_what .window-inner')
        const filterButtonWhen  = document.getElementById('filter_button_when')
        const filterWhen        = document.querySelector('#filter_when .window-inner')
        const filterButtonWho   = document.getElementById('filter_button_who')
        const filterWho         = document.querySelector('#filter_who .window-inner')
        filterButtonWhat.addEventListener('click',()=>filterToggle(filterWhat))
        filterWhat.addEventListener('animationend', ()=>filterAnimationEnd(filterWhat))
        filterButtonWhen.addEventListener('click', ()=>filterToggle(filterWhen))
        filterWhen.addEventListener('animationend', ()=>filterAnimationEnd(filterWhen))
        filterButtonWho.addEventListener('click', ()=>filterToggle(filterWho))
        filterWho.addEventListener('animationend', ()=>filterAnimationEnd(filterWho))

        async function filterToggle(filter){
            if(popupOpen){
                await popupClose()
            }
            if(!openFilter){
                filter.classList.add('open')
                openFilter = filter
            }else{
                if(openFilter != filter){
                    openFilter.classList.add('close')
                    openFilter = filter
                }else{
                    filter.classList.add('close')
                    openFilter = false
                }
            }
            }

        function filterAnimationEnd(filter){
            if(filter.classList.contains('close')){
                filter.classList.remove('close', 'open')
            }
            if(openFilter){
                openFilter.classList.add('open')
            }
        }
        function popupClose(button){
            return new Promise(resolve=>{
                const popup = document.querySelector('#popup_main .window-inner')
                if(popup){
                    popup.classList.remove('open')
                    popup.classList.add('close')
                    popup.addEventListener('animationend',()=>{
                        popupOpen = false
                        resolve()
                    }, {once:true})
                }
            })
        }
        

        var map = L.map('map',{zoomControl:false}).setView([51.505, -0.09], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        const marker = L.marker([51.5, -0.09]).addTo(map)
        marker.on('click', e=>{
            htmx.ajax('GET', '/mockup/popup.html', {
                target: '#popup_main',
                swap: 'innerHTML transition:true'
            })
            popupOpen = true;
        })
    </script>
    <script src="../static/js/load.js"></script>
</body>
</html>
