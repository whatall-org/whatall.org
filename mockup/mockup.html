<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        #loading{
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2500;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity .5s ease;
            
        }
        #loading .loader{
            width: 150px;
            aspect-ratio: 1;
            display: grid;
            -webkit-mask: conic-gradient(from 22deg, #0003,#000);
            mask: conic-gradient(from 22deg, #0003,#000);
            animation: load .5s steps(8) infinite;
        }
        #loading .loader, .loader::before{
            --_g: linear-gradient(#17177c 0 0) 50%;
            background:
                var(--_g) 50%/34% 8% space no-repeat,
                var(--_g) 50%/8% 34% no-repeat space;
        }
        #loading .loader::before{
            content: "";
            transform: rotate(45deg);
        }
        @keyframes load{
            to{transform:rotate(1turn)}
        }

        #loading.loaded{
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Mockup</title>
    <link 
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <div id="loading">
        <div class="loader"></div>
    </div>
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"
    ></script>
    <script src="//unpkg.com/alpinejs" defer></script>
    <div id="root">
        <header class="header-map">
            <nav>
                <a href="/">about</a>
                <a href="/">contribute</a>
                <a href="/">requests</a>
            </nav>
            <div class="filters">
                <img class="filter-callout" src="../static/images/icons/filter-solid-full.svg" alt="">
                <div class="button-wrap">
                    <div class="filter-button-container">
                        <button id="filter_button_what"><img src="../static/images/icons/music-note.png" alt="">
                            what
                        </button>
                        <div class="filter-what-arrow"></div>
                    </div>
                    <div class="filter-button-container">
                        <button id="filter_button_when"><img src="../static/images/icons/calendar-regular-full-black.svg" alt="">
                            when
                        </button>
                        <div class="filter-when-arrow"></div>
                    </div>
                    <div class="filter-button-container">
                        <button id="filter_button_who"><img src="../static/images/icons/people-icon-gay.png" alt="">
                            who
                        </button>
                        <div class="filter-who-arrow"></div>
                    </div>
                </div>
                <div id="filter_what" class="filter-window">
                    <div class="window-inner" data-filter-name="what">
                        <form action="">
                            <div class="title">
                                <h3>What is it?</h3>
                            </div>
                            <div class="category input-wrapper">
                                <label for="categories">Categories:</label>
                                <select multiple name="categories" id="input_categories">
                                    <option value="music">Music</option>
                                    <option value="community">Community</option>
                                    <option value="civics">Civics</option>
                                    <option value="exercise">Exercise</option>
                                    <option value="diy">DIY</option>
                                    <option value="mutual_aid">Mutual Aid</option>
                                    <option value="dancing">Dancing</option>
                                    <option value="reading">Reading</option>
                                </select>
                            </div>
                            <div class="twentyoneplus input-wrapper">
                                <label for="twentyone_plus">Twenty One Plus:</label>
                                <input type="checkbox" name="twentyone_plus" id="bool_twentyone_plus">
                            </div>
                            <div class="food input-wrapper">
                                <label for="food">Food:</label>
                                <input type="checkbox" name="food" id="input_food">
                            </div>
                            <div class="amenities">
                                <p class="title">Amenities</p>
                                <div class="parking input-wrapper">
                                    <label for="parking">Parking:</label>
                                    <input type="checkbox" name="parking" id="input_parking">
                                </div>
                                <div class="ada-compliant input-wrapper">
                                    <label for="ada_compliant">ADA Compliant</label>
                                    <input type="checkbox" name="ada_compliant" id="input_ada_compliant">
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div id="filter_when" class="filter-window">
                    <div class="window-inner" data-filter-name="when">
                        <form action="">
                            <div class="title">
                                <h3>When is it?</h3>
                            </div>
                            <div class="time input-wrapper">
                                <label for="time">After:</label>
                                <input type="time" name="time" id="input_time">
                            </div>
                            <div class="month input-wrapper">
                                <label for="month">Month:</label>
                                 <select name="month" id="input_month">
                                    <option value="01">January</option>
                                    <option value="02">February</option>
                                    <option value="03">March</option>
                                    <option value="04">April</option>
                                    <option value="05">May</option>
                                    <option value="06">June</option>
                                    <option value="07">July</option>
                                    <option value="08">August</option>
                                    <option value="09">September</option>
                                    <option value="10">October</option>
                                    <option value="11">November</option>
                                    <option value="12">December</option>
                                 </select>
                            </div>
                            <div class="month input-wrapper">
                                <label for="day">Day:</label>
                                <select name="day" id="input_day">
                                    <option value="1">Monday</option>
                                    <option value="2">Tuesday</option>
                                    <option value="3">Wednesday</option>
                                    <option value="4">Thursday</option>
                                    <option value="5">Friday</option>
                                    <option value="6">Saturday</option>
                                    <option value="0">Sunday</option>
                                </select>
                            </div>
                            <div class="date input-wrapper">
                                <label for="date">Date:</label>
                                <input type="date" name="date" id="input_date">
                            </div>
                        </form>
                    </div>
                </div>
                <div id="filter_who" class="filter-window">
                    <div class="window-inner" data-filter-name="who">
                        <form action="">
                            <div class="title">
                                <h3>Who is it?</h3>
                            </div>
                            <div class="age input-wrapper">
                                <label for="age">Age:</label>
                                <select multiple name="age" id="input_age">
                                    <option value="children">Children</option>
                                    <option value="20s">20s</option>
                                    <option value="30s">30s</option>
                                    <option value="40s">40s</option>
                                    <option value="50s">50s</option>
                                    <option value="60s+">60s+</option>
                                    <option value="allages">All Ages</option>
                                </select>
                            </div>
                            <div class="identity input-wrapper">
                                <label for="identities">Identity:</label>
                                <select multiple name="identities" id="input_identities">
                                    <option value="gay">Gay AF</option>
                                    <option value="women">Women</option>
                                    <option value="goth">Goth</option>
                                    <option value="neurodivergent">Neurodivergent</option>
                                    <option value="disabled">Disabled</option>
                                </select>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </header>
        <div id="tooltip_filter_callout">
            <div class="close">X</div>
            <p>Click here to filter results</p>
        </div>
        <div id="popup_main"></div>
        <div id="map" class="content"></div>
        <footer class="footer-map">
            <p>Every submission is reviewed to add to the map!</p>
            <button>Submit an Event</button>
        </footer>
    </div>
    <script src="../static/js/windows.js"></script>
    <script>
        var map = L.map('map',{zoomControl:false}).setView([51.505, -0.09], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        const marker = L.marker([51.5, -0.09]).addTo(map)
        marker.on('click', ()=>popupOpen())
    </script>
    <script src="../static/js/load.js"></script>
</body>
</html>
