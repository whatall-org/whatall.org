<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        #loading{
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2500;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity .5s ease;
            
        }
        #loading .loader{
            width: 150px;
            aspect-ratio: 1;
            display: grid;
            -webkit-mask: conic-gradient(from 22deg, #0003,#000);
            mask: conic-gradient(from 22deg, #0003,#000);
            animation: load .5s steps(8) infinite;
        }
        #loading .loader, .loader::before{
            --_g: linear-gradient(#17177c 0 0) 50%;
            background:
                var(--_g) 50%/34% 8% space no-repeat,
                var(--_g) 50%/8% 34% no-repeat space;
        }
        #loading .loader::before{
            content: "";
            transform: rotate(45deg);
        }
        @keyframes load{
            to{transform:rotate(1turn)}
        }

        #loading.loaded{
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Mockup</title>
    <link 
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <div id="loading">
        <div class="loader"></div>
    </div>
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <div id="root">
        <header class="header-map">
            <nav>
                <a href="/">about</a>
                <a href="/">contribute</a>
                <a href="/">requests</a>
            </nav>
            <div class="filters">
                <button>when</button>
                <button>what</button>
                <button>who</button>
            </div>
        </header>
        <div id="map" class="content"></div>
        <footer class="footer-map">

        </footer>
    </div>
    <script>
        var map = L.map('map',{zoomControl:false}).setView([51.505, -0.09], 13);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        L.marker([51.5, -0.09]).addTo(map)
            .bindPopup('A pretty CSS popup.<br> Easily customizable.')
            .openPopup();

    </script>
    <script src="./static/js/load.js"></script>
</body>
</html>
